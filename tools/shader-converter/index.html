<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra GLSL to WGSL Converter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #1a1a1a;
            color: #ddd;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        h1 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #fff;
        }

        .container {
            display: flex;
            flex: 1;
            gap: 20px;
            min-height: 0;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            flex: 1;
            background: #2a2a2a;
            color: #f0f0f0;
            border: 1px solid #444;
            padding: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            resize: none;
            border-radius: 4px;
        }

        .controls {
            padding: 10px 0;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0077ee;
        }

        .status {
            color: #888;
            font-size: 0.9rem;
            margin-left: auto;
        }

        .error {
            color: #ff4444;
        }

        .success {
            color: #44ff44;
        }
    </style>
</head>

<body>
    <h1>Hydra GLSL -> WGSL Converter</h1>
    <div class="controls">
        <button id="btn-convert">Convert Shaders</button>
        <label><input type="checkbox" id="chk-overwrite"> Overwrite existing WGSL</label>
        <span id="status" class="status">Ready</span>
    </div>
    <div class="container">
        <div class="pane">
            <label>Input (JS file content)</label>
            <textarea id="input-code" placeholder="Paste extra-shaders-for-hydra.js content here..."></textarea>
        </div>
        <div class="pane">
            <label>Output</label>
            <textarea id="output-code" readonly placeholder="Converted code will appear here..."></textarea>
        </div>
    </div>
    <script type="module" src="converter.js"></script>
</body>

</html>
